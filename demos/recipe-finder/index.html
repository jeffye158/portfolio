<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Finder</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fdf6ec;
    margin: 0;
    padding: 0;
    color: #333;
  }
  header {
    background: #d1603d;
    color: white;
    padding: 20px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 28px;
  }
  .search-box {
    max-width: 500px;
    margin: 20px auto;
    display: flex;
    gap: 8px;
    padding: 0 10px;
  }
  #searchInput {
    flex: 1;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #searchBtn {
    padding: 10px 18px;
    background: #d1603d;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
  #searchBtn:hover {
    background: #b34e30;
  }
  #results {
    max-width: 900px;
    margin: 0 auto;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: white;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    cursor: pointer;
  }
  .card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
  }
  .card h3 {
    font-size: 15px;
    margin: 10px;
  }
  #message {
    text-align: center;
    color: #888;
    margin-top: 30px;
  }
  /* modal */
  #modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: flex-start;
    padding: 30px 10px;
    overflow-y: auto;
  }
  #modalContent {
    background: white;
    max-width: 600px;
    width: 100%;
    margin: auto;
    border-radius: 6px;
    padding: 20px;
    position: relative;
  }
  #modalContent img {
    width: 100%;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  #closeBtn {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 22px;
    cursor: pointer;
    background: none;
    border: none;
  }
  #modalContent h2 {
    margin-top: 0;
  }
  #modalContent ul {
    padding-left: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>Recipe Finder</h1>
  <p>Search a dish and get the ingredients + instructions</p>
</header>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="e.g. chicken, pasta, cake...">
  <button id="searchBtn">Search</button>
</div>

<div id="results"></div>
<p id="message"></p>

<!-- modal for recipe details -->
<div id="modal">
  <div id="modalContent">
    <button id="closeBtn">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const API_URL = "https://www.themealdb.com/api/json/v1/1/search.php?s=";

const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const resultsDiv = document.getElementById("results");
const messageEl = document.getElementById("message");
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modalBody");
const closeBtn = document.getElementById("closeBtn");

searchBtn.addEventListener("click", doSearch);
searchInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") doSearch();
});
closeBtn.addEventListener("click", function() {
  modal.style.display = "none";
});
modal.addEventListener("click", function(e) {
  if (e.target === modal) modal.style.display = "none";
});
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") modal.style.display = "none";
});

function doSearch() {
  const term = searchInput.value.trim();
  if (!term) return;

  messageEl.textContent = "Loading...";
  resultsDiv.innerHTML = "";

  fetch(API_URL + encodeURIComponent(term))
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (!data.meals) {
        messageEl.textContent = "No recipes found for \"" + term + "\". Try another word.";
        return;
      }
      messageEl.textContent = "";
      renderResults(data.meals);
    })
    .catch(function(err) {
      messageEl.textContent = "Something went wrong, try again.";
      console.log(err);
    });
}

function renderResults(meals) {
  resultsDiv.innerHTML = "";
  meals.forEach(function(meal) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<img src="' + meal.strMealThumb + '" alt="' + meal.strMeal + '">' +
      '<h3>' + meal.strMeal + '</h3>';
    card.addEventListener("click", function() {
      showDetails(meal);
    });
    resultsDiv.appendChild(card);
  });
}

function showDetails(meal) {
  // build ingredient list, the API stores them as strIngredient1..20
  let ingredientsHtml = "<ul>";
  for (let i = 1; i <= 20; i++) {
    const ing = meal["strIngredient" + i];
    const measure = meal["strMeasure" + i];
    if (ing && ing.trim() !== "") {
      ingredientsHtml += "<li>" + measure + " " + ing + "</li>";
    }
  }
  ingredientsHtml += "</ul>";

  modalBody.innerHTML =
    "<img src='" + meal.strMealThumb + "' alt='" + meal.strMeal + "'>" +
    "<h2>" + meal.strMeal + "</h2>" +
    "<p><strong>Category:</strong> " + meal.strCategory + " | <strong>Area:</strong> " + meal.strArea + "</p>" +
    "<h3>Ingredients</h3>" + ingredientsHtml +
    "<h3>Instructions</h3><p>" + meal.strInstructions.replace(/\r\n/g, "<br>") + "</p>";

  modal.style.display = "flex";
}
</script>

</body>
</html>
